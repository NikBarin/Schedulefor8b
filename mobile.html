  <style>
    :root {
      --bg1:#050b18;
      --bg2:#0b1426;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --accent: #67c8ff;
      --accent-2: #d685ff;
      --text:#eef5ff;
      --muted:#9fb3d1;
      --green: #6dd986;
      font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:radial-gradient(600px 400px at 10% 15%, rgba(103,200,255,0.1), transparent),
                 radial-gradient(600px 400px at 90% 85%, rgba(214,133,255,0.07), transparent),
                 linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      display:flex;
      flex-direction:column;
      min-height:100vh;
      padding:12px;
    }

    header{
      text-align:center;
      padding:12px 0 8px 0;
    }
    .title{font-size:22px;font-weight:700;}
    .subtitle{color:var(--muted);font-size:13px;}

    .day-selector{
      display:flex;
      overflow-x:auto;
      gap:8px;
      justify-content:flex-start;
      padding:10px 4px;
      margin-bottom:12px;
    }
    .day-selector button{
      flex-shrink:0;
      background:rgba(255,255,255,0.05);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      padding:8px 14px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s;
      white-space:nowrap;
    }
    .day-selector button.active{
      background:linear-gradient(90deg, rgba(103,200,255,0.2), rgba(214,133,255,0.2));
      border-color:var(--accent);
    }

    .schedule{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .lesson-card{
      background:var(--glass);
      border:1px solid var(--border);
      backdrop-filter:blur(10px);
      border-radius:14px;
      padding:12px 16px;
      box-shadow:0 6px 18px rgba(0,0,0,0.25);
      display:flex;
      flex-direction:column;
      gap:6px;
      transition:transform 0.15s ease;
    }
    .lesson-card.active-now{
      border-color:var(--green);
      box-shadow:0 6px 18px rgba(109,217,134,0.25);
    }
    .lesson-card:active{transform:scale(0.98);}
    .lesson-time{color:var(--muted);font-weight:600;font-size:13px;}
    .lesson-name{font-size:17px;font-weight:700;}
    .lesson-info{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted);}
    .lesson-hw{font-size:14px;margin-top:4px;color:var(--accent);}

    .lesson-countdown {
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
    }
    .lesson-countdown.before {
      background: rgba(103,200,255,0.12);
      color: var(--accent);
    }
    .lesson-countdown.during {
      background: rgba(109,217,134,0.12);
      color: var(--green);
    }

    .countdown-banner {
      background: rgba(103,200,255,0.1);
      border: 1px solid rgba(103,200,255,0.25);
      border-radius: 14px;
      padding: 12px 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .lesson-img {
      margin-top: 8px;
      border-radius: 10px;
      max-height: 120px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    #imgModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #imgModal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }
    #imgModalClose {
      position: absolute;
      top: 25px;
      right: 25px;
      font-size: 32px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding:12px 0;opacity:0.7;}

<body>
  <header>
    <div class="title">РАСПИСАШКА</div>
    <div class="subtitle">Информация может быть неточной</div>
  </header>

  <div class="day-selector" id="daySelector">
    <button class="active" data-day="Понедельник">Пн</button>
    <button data-day="Вторник">Вт</button>
    <button data-day="Среда">Ср</button>
    <button data-day="Четверг">Чт</button>
    <button data-day="Пятница">Пт</button>
  </div>

  <div class="schedule" id="scheduleList"></div>

  <footer>Сделано с помощью ChatGPT</footer>

  <div id="imgModal">
    <div id="imgModalClose">✕</div>
    <img id="imgModalContent" src="">
  </div>

  <script>
    const times = [
      '8:00–8:40','9:00–9:40','10:00–10:40',
      '11:00–11:40','11:50–12:30','12:40–13:20','13:40–14:20'
    ];

    function parseTimeRange(str) {
      const [s, e] = str.split('–');
      const toMin = t => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      };
      return { start: toMin(s), end: toMin(e) };
    }

    function formatCountdown(totalSeconds) {
      if (totalSeconds <= 0) return '0 сек';
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      if (m > 0) return m + ' мин ' + (s < 10 ? '0' : '') + s + ' сек';
      return s + ' сек';
    }

    function formatCountdownBig(totalSeconds) {
      if (totalSeconds <= 0) return '0 сек';
      const d = Math.floor(totalSeconds / 86400);
      const h = Math.floor((totalSeconds % 86400) / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const parts = [];
      if (d > 0) parts.push(d + ' д');
      if (h > 0) parts.push(h + ' ч');
      if (m > 0) parts.push(m + ' мин');
      parts.push(s + ' сек');
      return parts.join(' ');
    }

    const weekDays = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    const schoolDays = ['Понедельник','Вторник','Среда','Четверг','Пятница'];

    function getNextSchoolDay(dayName) {
      const idx = schoolDays.indexOf(dayName);
      if (idx === -1) return 'Понедельник';
      if (idx + 1 < schoolDays.length) return schoolDays[idx + 1];
      return 'Понедельник';
    }

    function getDayOffset(fromName, toName) {
      const fromIdx = weekDays.indexOf(fromName);
      const toIdx = weekDays.indexOf(toName);
      if (fromIdx === -1 || toIdx === -1) return 1;
      if (toIdx > fromIdx) return toIdx - fromIdx;
      return 7 - fromIdx + toIdx;
    }

    function areLessonsDone(dayName, nowSec) {
      if (!schoolDays.includes(dayName)) return true;
      const lastEnd = parseTimeRange(times[data[dayName].length - 1]).end * 60;
      return nowSec >= lastEnd;
    }

    const data = {
  'Понедельник': [
    { lesson: 'Классный час', room: '45', teacher: 'Виктор Викторович', hw: '', img: 'img1.jpg' },
    { lesson: 'Русский', room: '33', teacher: 'Алёна Сергеевна', hw: 'упр.27 приготовиться к словарному диктанту.', img: '' },
    { lesson: 'Алгебра', room: '46', teacher: 'Екатерина Сергеевна', hw: '', img: '' },
    { lesson: 'Физкультура', room: 'любой', teacher: 'Сергей Александрович', hw: '', img: '' },
    { lesson: 'Английский язык', room: '30/49а', teacher: 'Оксана Евгеньевна/Марина Владиславовна', hw: '', img: '' },
    { lesson: 'Геометрия', room: '46', teacher: 'Екатерина Сергеевна', hw: 'с. 108-109 выучить определения, свойства, признаки прямоугольника, ромба, квадрата. Решить задачу из файла.', img: '' },
    { lesson: 'Музыка', room: '37', teacher: 'Юлия Авенировна', hw: '', img: '' }
  ],
  'Вторник': [
    { lesson: 'География', room: '49', teacher: 'Виктория Владимировна', hw: 'Повторить тему по параграфу 5. Для самопроверки устно выполните задания в конце параграфа.', img: '' },
    { lesson: 'Коми', room: '22', teacher: 'Марина Иванова', hw: '', img: '' },
    { lesson: 'Русский', room: '33', teacher: 'Алёна Сергеевна', hw: 'упр 73', img: '' },
    { lesson: 'Химия', room: '28', teacher: 'Варвара Викторовна', hw: 'Учить таблицу с произношением химических элементов', img: '' },
    { lesson: 'История', room: '48', teacher: 'Павл сергей', hw: '', img: '' },
    { lesson: 'ОБЗР', room: '45', teacher: '', hw: 'Повторить записи', img: '' },
    { lesson: 'Литератра', room: '33', teacher: 'Алёна Сергеевна', hw: '', img: '' }
  ],
  'Среда': [
    { lesson: 'Литератра', room: '33', teacher: 'Алёна Сергеевна', hw: '', img: '' },
    { lesson: 'Химия', room: '28', teacher: 'Варвара Викторовна', hw: '', img: '' },
    { lesson: 'Физкультура', room: 'любой', teacher: 'Сергей Александрович', hw: '', img: '' },
    { lesson: 'Алгебра', room: '46', teacher: 'Екатерина Сергеевна', hw: '', img: '' },
    { lesson: 'Английский язык/Информатика', room: '49а/39', teacher: 'Марина Владиславовна/Иван Алексеевич', hw: '/Повторить правила перевода из 10 в 2 СС. Перевести числа 256, 333, 853 Повторить правила перевода из 2 в 10 СС. Перевести числа 101011, 11111101, 1111010101', img: '' },
    { lesson: 'История', room: '31', teacher: 'Павел Сергеевич', hw: '', img: '' },
    { lesson: 'Физика', room: '36', teacher: 'Иван Анатольевич', hw: '', img: '' }
  ],
  'Четверг': [
    { lesson: 'Труд', room: '29', teacher: 'Надежда Сергеевна', hw: '', img: '' },
    { lesson: 'География', room: '49', teacher: 'Виктория Владимировна', hw: '', img: '' },
    { lesson: 'Геометрия', room: '46', teacher: 'Екатерина Сергеевна', hw: '', img: '' },
    { lesson: 'Английский язык', room: '30/49а', teacher: 'Оксана Евгеньевна/Марина Владиславовна', hw: '', img: '' },
    { lesson: 'Биология', room: '28', teacher: 'Елена Анатольевна', hw: '', img: '' },
    { lesson: 'Русский Язык', room: '33', teacher: 'Алёна Сергеевна', hw: '', img: '' },
    { lesson: 'История', room: '48', teacher: 'Павел Сергеевич', hw: '', img: '' }
  ],
  'Пятница': [
    { lesson: 'Английский язык/Информатика', room: '30/39', teacher: 'Оксана Евгеньевна/Юлия Сергеевна', hw: 'стр 23 №9,10 пись', img: '' },
    { lesson: 'Алгебра', room: '46', teacher: 'Екатерина Сергеевна', hw: '№369', img: '' },
    { lesson: 'Физкультура', room: 'любой', teacher: 'Сергей Александрович', hw: '', img: '' },
    { lesson: 'Физика', room: '29', teacher: 'Иван Анатольевич', hw: 'Прочитать п.7 еще раз тем, кто не читал! Повторить п.8-9. Подготовиться к опросу', img: '' },
    { lesson: 'Теория Вероятности', room: '46', teacher: 'Екатерина Сергеевна', hw: 'решить задачи из файла', img: '20260911_114849.jpg' },
    { lesson: 'Биология', room: '14', teacher: 'Елена Анатольевна', hw: 'Выучить содержание таблицы "Ткани". Прочитать п.4. Уметь приводить примеры органов и систем органов', img: '' }, 
    { lesson: 'Родной русский', room: '33', teacher: 'Алёна Сергеевна', hw: '', img: '' }
  ]
};

    const list = document.getElementById('scheduleList');
    const dayButtons = document.querySelectorAll('#daySelector button');
    let currentDay = 'Понедельник';

    function renderDayCards(day) {
      dayButtons.forEach(b => b.classList.toggle('active', b.dataset.day === day));
      list.innerHTML = '';
      data[day].forEach((row, i) => {
        const card = document.createElement('div');
        card.className = 'lesson-card';
        card.innerHTML = `
          <div class="lesson-time">${times[i]}</div>
          <div class="lesson-name">${row.lesson}</div>
          <div class="lesson-info">
            <span>Каб. ${row.room}</span>
            <span>${row.teacher}</span>
          </div>
          ${row.hw ? `<div class="lesson-hw">ДЗ: ${row.hw}</div>` : ''}
          ${row.img ? `<img src="${row.img}" class="lesson-img">` : ''}
          <div class="lesson-countdown" id="cd-${i}"></div>
        `;
        list.appendChild(card);
      });
      document.querySelectorAll('.lesson-img').forEach(img => {
        img.onclick = () => openModal(img.src);
      });
    }

    function renderDay(day) {
      currentDay = day;
      renderDayCards(day);
      updateCountdowns();
    }

    function updateCountdowns() {
      var now = new Date();
      var nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      var todayName = weekDays[now.getDay()];
      var isTodaySchoolDay = schoolDays.includes(todayName);
      var nextDay = getNextSchoolDay(todayName);

      // Очищаем все плашки
      for (var i = 0; i < data[currentDay].length; i++) {
        var el = document.getElementById('cd-' + i);
        if (el) {
          el.textContent = '';
          el.className = 'lesson-countdown';
        }
        if (el) {
          var card = el.closest('.lesson-card');
          if (card) card.classList.remove('active-now');
        }
      }

      // Удаляем старый баннер
      var oldBanner = document.querySelector('.countdown-banner');
      if (oldBanner) oldBanner.remove();

      // Случай 1: открыт сегодняшний день
      if (currentDay === todayName && isTodaySchoolDay) {
        for (var i = 0; i < data[currentDay].length; i++) {
          var range = parseTimeRange(times[i]);
          var startSec = range.start * 60;
          var endSec = range.end * 60;
          var el = document.getElementById('cd-' + i);
          if (!el) continue;
          var card = el.closest('.lesson-card');

          if (nowSec >= startSec && nowSec < endSec) {
            el.className = 'lesson-countdown during';
            el.textContent = 'До конца урока: ' + formatCountdown(endSec - nowSec);
            if (card) card.classList.add('active-now');
            return;
          } else if (nowSec < startSec) {
            el.className = 'lesson-countdown before';
            el.textContent = 'До начала урока: ' + formatCountdown(startSec - nowSec);
            return;
          }
        }

        // Все уроки сегодня прошли — ничего не показываем
        return;
      }

      // Случай 2: открыт следующий учебный день и сегодня все уроки прошли
      if (currentDay === nextDay) {
        var todayDone = !isTodaySchoolDay || areLessonsDone(todayName, nowSec);
        if (todayDone) {
          var offset = getDayOffset(todayName, currentDay);
          var firstStart = parseTimeRange(times[0]).start * 60;
          var targetSec = offset * 86400 + firstStart - nowSec;
          var el = document.getElementById('cd-0');
          if (el) {
            el.className = 'lesson-countdown before';
            el.textContent = 'До начала урока: ' + formatCountdownBig(targetSec);
          }
        }
        return;
      }

      // Случай 3: любой другой день — без отсчёта
    }

    var modal = document.getElementById("imgModal");
    var modalImg = document.getElementById("imgModalContent");
    var modalClose = document.getElementById("imgModalClose");

    function openModal(src) {
      modalImg.src = src;
      modal.style.display = "flex";
    }

    modalClose.onclick = function() { modal.style.display = "none"; };
    modal.onclick = function(e) { if (e.target === modal) modal.style.display = "none"; };

    dayButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        renderDay(btn.dataset.day);
      });
    });

    var todayName = weekDays[new Date().getDay()];
    if (schoolDays.includes(todayName)) {
      var nowSec = new Date().getHours() * 3600 + new Date().getMinutes() * 60;
      if (areLessonsDone(todayName, nowSec)) {
        renderDay(getNextSchoolDay(todayName));
      } else {
        renderDay(todayName);
      }
    } else {
      renderDay('Понедельник');
    }

    setInterval(updateCountdowns, 1000);
  </script>
</body>
